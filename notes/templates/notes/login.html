{% extends "notes/layout.html" %}

{% block body %}

    <h2 class="display-4" style="margin-bottom: 25px;">Log in</h2>

    {% if message %}
    <div class="alert alert-danger" role="alert">
        {{ message }}
    </div>
        
    {% endif %}    
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input autofocus class="form-control" type="text" name="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="password" placeholder="Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Login" style="margin-bottom: 10px;">
    </form>

    Don't have an account? <a href="{% url 'register' %}">Register here.</a>

{% endblock %}
