{% extends "notes/layout.html" %}

{% block body %}
    {% for note in notes %}
    
        <div class="container my-5" style="max-width: 800px;">
                <div style="border-top-width: 8px !important;border-left-width: 8px !important;border-radius: 10px" class="card shadow-lg rounded-4 border-top border-4 border-primary border bg-white
                    {% if note.priority|upper == 'HIGH' %}
                        border-danger
                    {% elif note.priority|upper == 'MEDIUM' %}
                        border-warning
                    {% else %}
                        border-primary
                    {% endif %}
                    mb-3">
                    <!-- Optional Header -->
                    <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                        <h2 class="display-4" style="margin-bottom: 25px;">{{note.title}}</h2>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">Active</span>
                    </div>

                    <!-- Main Content Area -->
                    <div class="card-body p-4">
                        <p class="card-text text-secondary lh-lg fs-6">
                            {{note.content}}
                        </p>
                    </div>

                    <!-- Optional Footer -->
                    <div class="card-footer bg-transparent border-0 pb-4 px-4 text-muted small d-flex justify-content-between">
                        <a href="{% url 'edit_task' note.id %}" class="text-decoration-none fw-semibold">Edit Note →</a>
                    </div>
                </div>
        </div>
    {%endfor%}
{% endblock %}
