{%load static%}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="{% static 'notes/logo.png' %}">
        <title>{%block title%}NOTEon{%endblock%}</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="{% static 'notes/style.css' %}" rel="stylesheet"> 
        
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light p-3">
          <a class="navbar-brand mr-4" href="{% url 'index'%}"><strong>NOTEon</strong></a>

          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'index'%}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="#">Archive</a>
                </li>
                <li>
                    <form class="form-inline my-2 my-lg-0 mr-auto">
                        <input style="margin-left: 20px;" class="form-control me-3 " type="search" placeholder="Search" aria-label="Search"/>
                        <button class="btn custom-search-btn " type="submit">Search Notes</button>
                    </form>
                </li>
            </ul>


            <!-- ml-auto pushes this form all the way to the far right in Bootstrap 4 -->
            

            <form class="form-inline my-2 my-lg-0 ml-auto" action="{% url 'newtask' %}" method="post" >
                {% csrf_token %}
                <button class="btn btn-outline-success" type="submit">+ New Note</button>
            </form>
          </div>
        </nav>

        <div class="container mt-4">
            {% block body %}
            {% endblock %}
        </div>
    </body>
</html>
